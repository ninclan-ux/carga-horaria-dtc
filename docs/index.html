<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; frame-src https://accounts.google.com/gsi/; connect-src https://accounts.google.com/gsi/ https://script.google.com https://script.googleusercontent.com">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FE5000" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
  <title>Carga horaria DTC</title>
  <meta name="description" content="Reporte semanal de carga horaria de Docentes Tiempo Completo de Unifranz.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FE5000'/%3E%3Cpath d='M16 8v8l5 3' stroke='%230F172A' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="saltar" href="#app">Ir al contenido</a>

  <header class="barra">
    <div class="barra-in">
      <div class="marca">
        <span class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </span>
        <span class="marca-texto"><strong>Unifranz</strong><span>Carga horaria · DTC</span></span>
      </div>
      <div class="usuario" id="usuario" hidden>
        <span class="usuario-correo" id="usuario-correo"></span>
        <button type="button" class="enlace" data-accion="salir">Salir</button>
      </div>
    </div>
    <div class="progreso" id="progreso" hidden>
      <div class="progreso-in">
        <p class="progreso-texto" id="progreso-texto"></p>
        <div class="progreso-barra" id="progreso-barra" role="progressbar" aria-label="Progreso del reporte" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      </div>
    </div>
  </header>

  <main id="app" class="contenedor" tabindex="-1">
    <noscript><p class="aviso aviso-error">Este formulario necesita JavaScript activado.</p></noscript>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <footer class="pie">
    <p>¿Algún problema? Escribe a <a id="soporte" href="#"></a></p>
  </footer>

  <script src="config.js"></script>
  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
